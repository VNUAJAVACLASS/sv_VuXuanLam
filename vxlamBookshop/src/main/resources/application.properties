spring.application.name=vxlam

spring.datasource.url = jdbc:mysql://localhost:3306/projectdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username = root
spring.datasource.password = 123456

# hibernate properties, MySQL b?n 8
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto = update

logging.level.org.springframework.security=INFO

server.port=8080 

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT config s? ???c ??c ra ? class, chu?i ph?i dài 32 ký t? tr? lên ?? ??t yêu c?u thu?t toán
jwt.secret = VeryLongSecretKeyThatIsAtLeast32Characters!
jwt.expiration-ms = 3600000
# Giúp Swagger b? qua các thu?c tính l?i và quét sâu h?n vào controller
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.show-actuator=false