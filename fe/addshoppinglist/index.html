<!DOCTYPE html>
<html>
<head>
  <title>Shopping List</title>
  <style>
    form {
      border: dashed black 1px;
      width: 200px;
      padding: 20px;
    }
    #app > div {
      border: solid black 1px;
      width: 80%;
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
    }
    figure {
      width: 80px;
      padding: 10px;
      margin: 10px;
      background-color: lightskyblue;
      border-radius: 5px;
    }
    figcaption {
      text-align: center;
    }
    img {
      width: 100%;
    }
  </style>
</head>
<body>

<h1>Example: Shopping List</h1>
<div id="app">
  <form v-on:submit.prevent="addItem">
    <p>
      What do you need?
      <select v-model="selectedItem">
        <option v-for="option in options" :value="option">{{ option.name }}</option>
      </select>
    </p>
    <p>
      How many?
      <input type="number" placeholder="number of items.." v-model="itemNumber">
    </p>
    <button type="submit">Add item</button>
  </form>

  <div>
    <figure v-for="item in shoppingList">
      <img v-bind:src="item.url">
      <figcaption>{{ item.name }}, {{ item.number}}</figcaption>
    </figure>
  </div>
</div>


<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script>
  const app = Vue.createApp({
    data() {
      return {
        itemNumber: null,
        selectedItem: null,
        options: [
          { name: 'Burrito', url: 'https://www.w3schools.com/vue/img_burrito.svg' },
          { name: 'Salad', url: 'https://www.w3schools.com/vue/img_salad.svg' },
          { name: 'Cake', url: 'https://www.w3schools.com/vue/img_cake.svg' },
          { name: 'Soup', url: 'https://www.w3schools.com/vue/img_soup.svg' },
          { name: 'Fish', url: 'https://www.w3schools.com/vue/img_fish.svg' },
          { name: 'Pizza', url: 'https://www.w3schools.com/vue/img_pizza.svg' },
          { name: 'Rice', url: 'https://www.w3schools.com/vue/img_rice.svg' }
        ],
        shoppingList: [
          { name: 'Tomatoes', number: 5, url: 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/89/Tomato_je.jpg/100px-Tomato_je.jpg' }
        ]
      }
    },
    methods: {
      addItem(){
        if (!this.selectedItem) return;
        let item = {
          name: this.selectedItem.name,
          number: this.itemNumber,
          url: this.selectedItem.url
        }
        this.shoppingList.push(item)
        this.itemNumber = null
        this.selectedItem = null
      }
    }
  })
 app.mount('#app')
</script>

</body>
</html>
